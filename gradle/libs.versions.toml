[versions]
android-compileSdk = "34"
android-minSdk = "24"
android-tagetSdk = "34"

gradle = "8.1.4"

androidx-appcompat = "1.6.1"
androidx-core = "1.12.0"
androidx-fragment = "1.6.2"
androidx-lifecycle = "2.7.0"

accompanist = "0.32.0"
google-material = "1.11.0"

coil = "2.5.0"

leak-canary = "2.12"

hilt = "2.47"
inject = "1"

retrofit = "2.9.0"
okhttp3 = "4.12.0"

# before update the kotin, check compability with androidx-compose-compiler
# @see https://developer.android.com/jetpack/androidx/releases/compose-kotlin
kotlin = "1.9.10"
kotlinx-coroutines = "1.7.3"
kotlinx-datetime = "0.5.0"

espresso-core = "3.5.1"
junit = "1.1.5"
junit4 = "4.13.2"
mockito-kotlin = "5.1.0"

[libraries]
kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-tools = { group = "com.android.tools.build", name = "gradle", version.ref = "gradle" }

androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidx-fragment" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }

hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
inject = { group = "javax.inject", name = "javax.inject", version.ref = "inject" }

retrofit2-runtime = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit2-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp3 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp3" }

kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junit" }

leak-canary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leak-canary" }

[bundles]
retrofit2 = [
    "retrofit2-runtime",
    "retrofit2-converter-gson",
    "okhttp3"
]

unit-tests = [
    "junit4",
    "mockito-kotlin"
]

android-tests = [
    "androidx-junit",
    "androidx-espresso-core"
]